[project]
name = "zadig-agent"
version = "0.1.0"
description = "Zadig OpenAPI MCP server and LangGraph agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "mcp>=1.24.0,<2",
    "langchain-mcp-adapters>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
zadig-mcp = "zadig_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "model", "utils", "zadig_mcp"]
